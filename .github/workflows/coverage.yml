name: coverage

on:
  push:
    branches: [ master, main ]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    env:
      BUILD_DIR: build
      CTEST_OUTPUT_ON_FAILURE: 1
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain & coverage deps
        run: |
          sudo apt-get update
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y gcc g++ lcov file
          else
            # ubuntu-24.04: get clang/llvm, OpenMP, and lcov for post-filtering
            sudo apt-get install -y clang llvm lcov file
            sudo apt-get install -y libomp-18-dev || sudo apt-get install -y libomp-dev
          fi
          pip install conan==2.20.1
          sudo locale-gen de_DE.UTF-8

      - name: Install coverage-compatible ccache
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          with urllib.request.urlopen(
              "https://api.github.com/repos/ccache/ccache/releases/latest",
              timeout=30,
          ) as response:
              release = json.load(response)
          asset = next(
              item for item in release["assets"]
              if item["name"].endswith("-linux-x86_64-glibc.tar.xz")
          )
          digest = asset.get("digest", "")
          if not digest.startswith("sha256:"):
              raise RuntimeError("Official ccache asset has no SHA-256 digest")
          with urllib.request.urlopen(asset["browser_download_url"], timeout=60) as response:
              archive = response.read()
          if hashlib.sha256(archive).hexdigest() != digest.split(":", 1)[1]:
              raise RuntimeError("Official ccache archive SHA-256 mismatch")
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "ccache.tar.xz").write_bytes(archive)
          print("Verified {} {}".format(release["tag_name"], digest))
          PY
          mkdir -p "$RUNNER_TEMP/ccache-bin"
          tar -xJf "$RUNNER_TEMP/ccache.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/ccache-bin"
          echo "$RUNNER_TEMP/ccache-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ccache-bin/ccache" --version

      - name: Identify compiler cache inputs
        id: compiler-cache
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          compiler_id="$(${{ matrix.cxx }} --version | sha256sum | cut -d' ' -f1)"
          echo "id=$compiler_id" >> "$GITHUB_OUTPUT"

      - name: Restore compiled coverage inputs
        id: coverage-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ~/.conan2/p
          key: coverage-ubuntu24-${{ runner.arch }}-${{ matrix.compiler }}-${{ steps.compiler-cache.outputs.id }}-debug-atomic-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**', '*.h', 'test/**', 'tools/**', '.github/workflows/coverage.yml') }}
          restore-keys: |
            coverage-ubuntu24-${{ runner.arch }}-${{ matrix.compiler }}-${{ steps.compiler-cache.outputs.id }}-debug-atomic-v1-

      - name: Resolve libsodium 1.0.22
        run: |
          conan profile detect --force
          conan install --requires=libsodium/1.0.22 --output-folder=deps \
            --generator=CMakeDeps --generator=CMakeToolchain \
            --settings=build_type=Debug --build=missing
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Configure (${{ matrix.compiler }})
        run: |
          cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/deps/conan_toolchain.cmake" \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_COVERAGE=ON \
            -DMEXCE_ENABLE_PROTECTED_EXPRESSIONS=ON \
            -DMEXCE_BUILD_ISSUER_TOOLS=ON

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build "$BUILD_DIR" --parallel 2

      - name: Report compiler cache use
        if: always()
        run: |
          ccache --show-stats --verbose
          ccache --print-stats | awk '
            $1 ~ /^(cache_miss|direct_cache_hit|preprocessed_cache_hit)$/ { calls += $2 }
            $1 ~ /^(local_storage_hit|local_storage_write)$/ { storage += $2 }
            END {
              if (calls == 0 || storage == 0) {
                print "Compiler cache produced no reusable coverage results" > "/dev/stderr"
                exit 1
              }
            }'

      - name: Save compiled coverage inputs
        if: steps.coverage-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ~/.conan2/p
          key: ${{ steps.coverage-cache.outputs.cache-primary-key }}

      - name: Test (also write JUnit)
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export LLVM_PROFILE_FILE="code-%p-%m.profraw"
          fi
          ctest --output-on-failure --output-junit test-results.xml

      # GCC: strict capture includes unexecuted lines and production files.
      - name: Coverage (lcov/gcc)
        if: matrix.compiler == 'gcc'
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          lcov --quiet --capture --initial --directory . --rc geninfo_unexecuted_blocks=1 -o base.info
          lcov --quiet --capture --directory . --rc geninfo_unexecuted_blocks=1 -o test.info
          lcov --quiet -a base.info -a test.info -o lcov.all.info
          lcov --quiet --extract lcov.all.info \
            "*/mexce.h" \
            "*/mexce_protected.h" \
            "*/mexce_protected_encoder.h" \
            "*/tools/mexce_protect_lib.cpp" \
            "*/tools/mexce_protect_lib.h" \
            "*/tools/mexce_protect.cpp" \
            -o lcov.info
          grep -q '^DA:' lcov.info || { echo "lcov.info holds no coverage records"; exit 1; }
          lcov --list lcov.info

      # Clang/LLVM: export every instrumented executable, then keep production files.
      - name: Coverage (llvm-cov/clang)
        if: matrix.compiler == 'clang'
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          llvm-profdata merge -sparse *.profraw -o default.profdata
          mapfile -t candidates < <(find . -maxdepth 1 -type f -executable -print | sort)
          binaries=()
          for candidate in "${candidates[@]}"; do
            if file "$candidate" | grep --quiet "ELF .* executable"; then
              binaries+=( "$candidate" )
            fi
          done
          if [ "${#binaries[@]}" -eq 0 ]; then
            echo "No instrumented executables found."
            exit 1
          fi

          object_args=()
          for binary in "${binaries[@]:1}"; do
            object_args+=( -object "$binary" )
          done
          llvm-cov export -format=lcov -instr-profile default.profdata \
            "${binaries[0]}" "${object_args[@]}" > lcov.all.info
          lcov --quiet --extract lcov.all.info \
            "*/mexce.h" \
            "*/mexce_protected.h" \
            "*/mexce_protected_encoder.h" \
            "*/tools/mexce_protect_lib.cpp" \
            "*/tools/mexce_protect_lib.h" \
            "*/tools/mexce_protect.cpp" \
            -o lcov.info
          grep -q '^DA:' lcov.info || { echo "lcov.info holds no coverage records"; exit 1; }
          lcov --list lcov.info

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v6
        with:
          files: build/lcov.info
          disable_search: true
          flags: ${{ matrix.compiler }}
          fail_ci_if_error: false
          use_oidc: true

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@v6
        with:
          report_type: test_results
          files: build/test-results.xml
          fail_ci_if_error: false
          use_oidc: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.compiler }}-coverage
          path: |
            build/lcov.info
            build/test-results.xml
