name: coverage

on:
  push:
    branches: [ master, main ]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    env:
      BUILD_DIR: build
      CTEST_OUTPUT_ON_FAILURE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain & coverage deps
        run: |
          sudo apt-get update
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y gcc g++ lcov
          else
            # ubuntu-24.04: get clang/llvm, OpenMP, and lcov for post-filtering
            sudo apt-get install -y clang llvm libomp-18-dev lcov || sudo apt-get install -y libomp-dev lcov
          fi

      - name: Configure (${{ matrix.compiler }})
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake -S . -B "$BUILD_DIR" \
              -DCMAKE_BUILD_TYPE=Debug \
              -DENABLE_COVERAGE=ON
          else
            cmake -S . -B "$BUILD_DIR" \
              -DCMAKE_BUILD_TYPE=Debug \
              -DENABLE_COVERAGE=ON \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++
          fi

      - name: Build
        run: cmake --build "$BUILD_DIR" -j

      - name: Test (also write JUnit)
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export LLVM_PROFILE_FILE="code-%p-%m.profraw"
          fi
          ctest --output-on-failure --output-junit test-results.xml

      # GCC: strict capture (includes unexecuted lines/files), then keep only your lib header
      - name: Coverage (lcov/gcc)
        if: matrix.compiler == 'gcc'
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          lcov --quiet --capture --initial --directory . --rc geninfo_unexecuted_blocks=1 -o base.info
          lcov --quiet --capture --directory . --rc geninfo_unexecuted_blocks=1 -o test.info
          lcov --quiet -a base.info -a test.info -o lcov.all.info
          lcov --quiet --extract lcov.all.info "*/mexce.h" -o lcov.info
          lcov --list lcov.info || true

      # Clang/LLVM: export to LCOV, then filter to mexce.h
      - name: Coverage (llvm-cov/clang)
        if: matrix.compiler == 'clang'
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          llvm-profdata merge -sparse *.profraw -o default.profdata
          BIN=./benchmark
          if [ ! -x "$BIN" ]; then
            echo "Expected test binary '$BIN' not found or not executable."
            ls -la
            exit 1
          fi
          llvm-cov export -format=lcov -instr-profile default.profdata "$BIN" > lcov.all.info
          lcov --quiet --extract lcov.all.info "*/mexce.h" -o lcov.info
          llvm-cov report -instr-profile default.profdata "$BIN" || true

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: build/lcov.info
          disable_search: true
          flags: ${{ matrix.compiler }}
          fail_ci_if_error: false
          use_oidc: true

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/test-results-action@v1
        with:
          files: build/test-results.xml
          fail_ci_if_error: false
          use_oidc: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.compiler }}-coverage
          path: |
            build/lcov.info
            build/test-results.xml
