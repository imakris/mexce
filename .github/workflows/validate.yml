name: Validate mexce

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      expected-architecture:
        type: string
        default: ''
      compiler:
        required: true
        type: string
      cc:
        required: true
        type: string
      cxx:
        required: true
        type: string
      configuration:
        type: string
        default: all
      checks:
        type: string
        default: full

permissions:
  contents: read

jobs:
  release-matrix:
    name: ${{ inputs.runner }} / ${{ inputs.compiler }} / ${{ matrix.configuration }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        configuration: >-
          ${{ fromJSON(inputs.checks == 'protected-benchmark' && '["protected"]' ||
          inputs.configuration == 'ordinary' && '["ordinary"]' ||
          inputs.configuration == 'protected' && '["protected"]' || '["ordinary", "protected"]') }}

    steps:
      - name: Validate selected checks
        if: inputs.checks == 'protected-benchmark' && inputs.configuration == 'ordinary'
        shell: bash
        run: |
          echo "::error::Protected benchmark checks require configuration=protected or all."
          exit 1

      - name: Validate hardened-runtime platform
        if: inputs.checks == 'hardened-runtime' && runner.os != 'macOS'
        shell: bash
        run: |
          echo "::error::Hardened-runtime checks require a native macOS runner."
          exit 1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify native macOS architecture
        if: runner.os == 'macOS'
        env:
          EXPECTED_ARCHITECTURE: ${{ inputs.expected-architecture }}
        run: |
          uname -m
          test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"

      - name: Set up Python on macOS
        if: runner.os == 'macOS' && matrix.configuration == 'protected'
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Conan
        if: matrix.configuration == 'protected'
        run: python -m pip install "conan>=2.28,<3"

      - name: Install Linux Clang dependencies
        if: runner.os == 'Linux' && inputs.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libomp-dev

      - name: Resolve libsodium 1.0.22 on Windows
        if: runner.os == 'Windows' && matrix.configuration == 'protected'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$installationPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          conan profile detect --force
          conan install --requires=libsodium/1.0.22 --output-folder=deps `
            --generator=CMakeDeps --generator=CMakeToolchain `
            --settings=build_type=Release --conf=tools.build:jobs=3 --build=missing

      - name: Resolve libsodium 1.0.22 on Unix
        if: runner.os != 'Windows' && matrix.configuration == 'protected'
        run: |
          conan profile detect --force
          conan install --requires=libsodium/1.0.22 --output-folder=deps \
            --generator=CMakeDeps --generator=CMakeToolchain \
            --options="libsodium/*:shared=False" \
            --settings=build_type=Release --conf=tools.build:jobs=3 --build=missing
        shell: bash
        env:
          CC: ${{ inputs.cc }}
          CXX: ${{ inputs.cxx }}

      - name: Configure ordinary Windows release
        if: runner.os == 'Windows' && matrix.configuration == 'ordinary'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure ordinary Unix release
        if: runner.os != 'Windows' && matrix.configuration == 'ordinary'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ inputs.cc }}
          -DCMAKE_CXX_COMPILER=${{ inputs.cxx }}

      - name: Configure protected Windows release and issuer
        if: runner.os == 'Windows' && matrix.configuration == 'protected'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/deps/conan_toolchain.cmake
          -DMEXCE_ENABLE_PROTECTED_EXPRESSIONS=ON
          -DMEXCE_BUILD_ISSUER_TOOLS=ON

      - name: Configure protected Unix release and issuer
        if: runner.os != 'Windows' && matrix.configuration == 'protected'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ inputs.cc }}
          -DCMAKE_CXX_COMPILER=${{ inputs.cxx }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/deps/conan_toolchain.cmake
          -DMEXCE_ENABLE_PROTECTED_EXPRESSIONS=ON
          -DMEXCE_BUILD_ISSUER_TOOLS=${{ inputs.checks == 'hardened-runtime' && 'OFF' || 'ON' }}

      - name: Build
        if: inputs.checks == 'full'
        run: cmake --build build --config Release --parallel 3

      - name: Build ARM arena for hardened-runtime checks
        if: inputs.checks == 'hardened-runtime' && inputs.expected-architecture == 'arm64'
        run: cmake --build build --config Release --target apple_jit_arena_tests --parallel 3

      - name: Build protected benchmark
        if: inputs.checks == 'protected-benchmark'
        run: cmake --build build --config Release --target protected_benchmark --parallel 3

      - name: Test
        if: inputs.checks == 'full'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        if: inputs.checks != 'protected-benchmark'
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/mexce-install"

      - name: Check installed notice surface
        if: inputs.checks != 'protected-benchmark'
        env:
          EXPECT_NOTICE: ${{ matrix.configuration == 'protected' && '1' || '0' }}
        run: >-
          python -c "import os, pathlib;
          p=pathlib.Path(r'${{ runner.temp }}')/'mexce-install/share/licenses/mexce/THIRD_PARTY_NOTICES.md';
          assert p.exists() == (os.environ['EXPECT_NOTICE'] == '1')"

      - name: Configure installed Windows consumer
        if: runner.os == 'Windows' && matrix.configuration == 'ordinary' && inputs.checks != 'protected-benchmark'
        run: >-
          cmake -S test/install_consumer -B consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/mexce-install
          -DMEXCE_FORBIDDEN_INCLUDE_ROOT=${{ github.workspace }}

      - name: Configure installed Unix consumer
        if: runner.os != 'Windows' && matrix.configuration == 'ordinary' && inputs.checks != 'protected-benchmark'
        run: >-
          cmake -S test/install_consumer -B consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ inputs.cxx }}
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/mexce-install
          -DMEXCE_FORBIDDEN_INCLUDE_ROOT=${{ github.workspace }}

      - name: Configure installed protected Windows consumer
        if: runner.os == 'Windows' && matrix.configuration == 'protected' && inputs.checks != 'protected-benchmark'
        run: >-
          cmake -S test/install_consumer -B consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/deps/conan_toolchain.cmake
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/mexce-install
          -DMEXCE_FORBIDDEN_INCLUDE_ROOT=${{ github.workspace }}
          -DMEXCE_CONSUMER_PROTECTED=ON

      - name: Configure installed protected Unix consumer
        if: runner.os != 'Windows' && matrix.configuration == 'protected' && inputs.checks != 'protected-benchmark'
        run: >-
          cmake -S test/install_consumer -B consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ inputs.cxx }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/deps/conan_toolchain.cmake
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/mexce-install
          -DMEXCE_FORBIDDEN_INCLUDE_ROOT=${{ github.workspace }}
          -DMEXCE_CONSUMER_PROTECTED=ON

      - name: Build installed consumer
        if: inputs.checks != 'protected-benchmark'
        run: cmake --build consumer-build --config Release --parallel 3

      - name: Run installed consumers on Unix
        if: runner.os != 'Windows' && inputs.checks != 'protected-benchmark'
        run: |
          ./consumer-build/mexce_ordinary_consumer
          if [ "${{ matrix.configuration }}" = protected ]; then
            ./consumer-build/mexce_protected_consumer
          fi
        shell: bash

      - name: Run installed consumers on Windows
        if: runner.os == 'Windows' && inputs.checks != 'protected-benchmark'
        run: |
          .\consumer-build\Release\mexce_ordinary_consumer.exe
          if ('${{ matrix.configuration }}' -eq 'protected') {
            .\consumer-build\Release\mexce_protected_consumer.exe
          }

      - name: Create documented issuer inputs
        if: matrix.configuration == 'protected' && inputs.checks == 'full'
        run: >-
          python -c "from pathlib import Path;
          Path('expression.txt').write_bytes(b'value+1\n');
          Path('bindings.txt').write_bytes(b'value=0\n')"

      - name: Run installed issuer and file consumer on Unix
        if: runner.os != 'Windows' && matrix.configuration == 'protected' && inputs.checks == 'full'
        run: |
          "${{ runner.temp }}/mexce-install/bin/mexce_protect" expression.txt bindings.txt expression.mxp expression.key
          ./consumer-build/mexce_protected_file_consumer expression.mxp expression.key
        shell: bash

      - name: Run installed issuer and file consumer on Windows
        if: runner.os == 'Windows' && matrix.configuration == 'protected' && inputs.checks == 'full'
        run: |
          & "${{ runner.temp }}\mexce-install\bin\mexce_protect.exe" expression.txt bindings.txt expression.mxp expression.key
          .\consumer-build\Release\mexce_protected_file_consumer.exe expression.mxp expression.key

      - name: Run hardened-runtime installed consumers and arena checks
        if: runner.os == 'macOS' && inputs.checks != 'protected-benchmark'
        run: bash .github/ci/check-hardened-runtime.sh "${{ matrix.configuration }}"

      - name: Upload hardened-runtime evidence
        if: always() && hashFiles('build/hardened-runtime/*') != ''
        uses: actions/upload-artifact@v6
        with:
          name: hardened-runtime-${{ inputs.runner }}-${{ matrix.configuration }}
          path: build/hardened-runtime

      - name: Run clear performance diagnostic
        if: inputs.checks == 'full'
        run: cmake --build build --config Release --target run_benchmarks --parallel 3

      - name: Run protected performance diagnostic on Unix
        if: runner.os != 'Windows' && matrix.configuration == 'protected' && inputs.checks != 'hardened-runtime'
        run: >-
          python analysis/run_protected_benchmarks.py
          build/protected_benchmark
          build/protected_benchmark_results.json
          --repeats 3
          --resource-repeats 1

      - name: Run protected performance diagnostic on Windows
        if: runner.os == 'Windows' && matrix.configuration == 'protected' && inputs.checks != 'hardened-runtime'
        run: >-
          python analysis/run_protected_benchmarks.py
          build/Release/protected_benchmark.exe
          build/protected_benchmark_results.json
          --repeats 3
          --resource-repeats 1

      - name: Upload diagnostic results
        if: always() && hashFiles('build/benchmark_results.txt', 'build/protected_benchmark_results.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-${{ inputs.runner }}-${{ inputs.compiler }}-${{ matrix.configuration }}
          if-no-files-found: warn
          path: |
            build/benchmark_results.txt
            build/protected_benchmark_results.json
