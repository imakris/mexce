name: macOS CI
run-name: >-
  macOS CI / ${{ inputs.architecture || 'all' }} /
  ${{ inputs.checks == 'protected-benchmark' && 'protected' || inputs.configuration || 'all' }} /
  ${{ inputs.checks || 'full' }}

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture to validate
        type: choice
        options: [all, arm64, intel]
        default: all
      configuration:
        description: Suites to validate
        type: choice
        options: [all, ordinary, protected]
        default: all
      checks:
        description: Validation to run
        type: choice
        options: [full, protected-benchmark, hardened-runtime]
        default: full

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: >-
          ${{ fromJSON(inputs.architecture == 'intel' && '["macos-15-intel"]' ||
          inputs.architecture == 'arm64' && '["macos-26"]' || '["macos-26", "macos-15-intel"]') }}
    uses: ./.github/workflows/validate.yml
    with:
      runner: ${{ matrix.runner }}
      expected-architecture: ${{ matrix.runner == 'macos-15-intel' && 'x86_64' || 'arm64' }}
      compiler: apple-clang
      cc: clang
      cxx: clang++
      configuration: ${{ inputs.configuration || 'all' }}
      checks: ${{ inputs.checks || 'full' }}
