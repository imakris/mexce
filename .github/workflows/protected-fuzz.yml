name: Protected decoder extended fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CONAN_HOME: ${{ github.workspace }}/.conan2
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 2GiB

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install compiler and dependency tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libomp-dev ccache ninja-build
          pip install conan==2.20.1

      - name: Restore dependency and compiler caches
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .conan2
            .ccache
          key: linux-mexce-fuzz-${{ hashFiles('.github/workflows/protected-fuzz.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-mexce-fuzz-${{ hashFiles('.github/workflows/protected-fuzz.yml') }}-

      - name: Resolve libsodium 1.0.22
        run: |
          conan profile detect --force
          conan install --requires=libsodium/1.0.22 --output-folder=deps \
            --generator=CMakeDeps --generator=CMakeToolchain \
            --settings=build_type=RelWithDebInfo --conf=tools.build:jobs=2 --build=missing

      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/deps/conan_toolchain.cmake
          -DMEXCE_ENABLE_PROTECTED_EXPRESSIONS=ON

      - name: Build fuzz target
        run: cmake --build build --target protected_decoder_fuzz --parallel 2

      - name: Seed authenticated format corpus
        run: |
          test -s test/fixtures/protected_format_1_0.bin
          mkdir -p fuzz-corpus
          cp test/fixtures/protected_format_1_0.bin fuzz-corpus/format-1.0.bin
          cmp test/fixtures/protected_format_1_0.bin fuzz-corpus/format-1.0.bin

      - name: Run extended decoder fuzzing
        run: |
          mkdir -p fuzz-artifacts
          ./build/protected_decoder_fuzz \
            fuzz-corpus \
            -max_total_time=900 \
            -timeout=10 \
            -artifact_prefix=fuzz-artifacts/

      - name: Compiler cache statistics
        if: always() && steps.build-cache.outcome == 'success'
        run: ccache --show-stats

      - name: Save dependency and compiler caches
        if: always() && steps.build-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            .conan2
            .ccache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: protected-fuzz-artifacts
          if-no-files-found: ignore
          path: fuzz-artifacts/
